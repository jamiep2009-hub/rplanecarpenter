name: Test editor

# No secrets, no setup. Runs the safety suite so a change that would
# break the website is caught before anyone opens the editor.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node admin/test/run.mjs
