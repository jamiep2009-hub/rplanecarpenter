name: Test website editor

# Cloudflare deploys the editor itself (connected directly to this repo),
# so this workflow only guards quality: if the safety tests fail, the
# failure is visible here before anything reaches the live editor.
# No secrets and no setup required.
on:
  push:
    branches: [main]
    paths: ['_admin/**', 'index.html', 'about.html', 'services.html', 'gallery.html', 'contact.html', 'privacy-policy.html', 'reviews-v2.js']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run safety tests
        working-directory: _admin
        run: node test/run.mjs
