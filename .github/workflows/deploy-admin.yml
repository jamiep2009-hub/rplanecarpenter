name: Deploy website editor

# Runs from the GitHub website — no terminal needed.
# Actions tab -> "Deploy website editor" -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['_admin/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A broken edit must never reach the live editor.
      - name: Run safety tests
        working-directory: _admin
        run: node test/run.mjs

      - name: Install dependencies
        working-directory: _admin
        run: npm install --no-audit --no-fund

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: _admin
          secrets: |
            GITHUB_TOKEN
            SESSION_SECRET
            ADMIN_PASSWORD_HASH
            ADMIN_PASSWORD_SALT
        env:
          # GitHub reserves the name GITHUB_TOKEN, so the repo secret is
          # called SITE_GITHUB_TOKEN and is mapped across here.
          GITHUB_TOKEN: ${{ secrets.SITE_GITHUB_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_PASSWORD_SALT: ${{ secrets.ADMIN_PASSWORD_SALT }}
